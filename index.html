  const tx=[];
  const add=(mBack,day,type,amount,cat,acc,note,extra)=>{const d=new Date(today.getFullYear(),today.getMonth()-mBack,day);
    if(mBack===0&&d>today)return;tx.push(Object.assign({id:uid(),type,amount,cat,acc,date:iso(d),note,ts:d.getTime()},extra||{}))};
  for(let m=5;m>=0;m--){
    add(m,1,"ingreso",120,"paga","banco","Paga mensual",{rec:"r3"});
    if(m%2===0)add(m,9,"ingreso",85+m*15,"ventas","bizum","Venta en Wallapop");
    add(m,3,"gasto",9.99,"suscripciones","banco","Spotify",{rec:"r1"});
    add(m,4,"gasto",18+m*2,"transporte","banco","Recarga T-jove");
    add(m,2,"gasto",14.5,"comida","efectivo","Menú con clase");
    add(m,11,"gasto",22+(m%3)*9,"ocio","bizum","Cine y cena");
    add(m,15,"gasto",27,"salud","banco","Cuota gimnasio",{rec:"r2"});
    add(m,19,"gasto",11.4,"comida","efectivo","Super");
    if(m%3===1)add(m,20,"gasto",59,"tecnologia","banco","Auriculares");
    if(m%2===1)add(m,24,"gasto",34,"compras","banco","Zapatillas");
  }
  add(0,2,"transfer",40,"","banco","Sacar efectivo",{to:"efectivo"});
  add(0,3,"gasto",6.8,"comida","efectivo","Bocadillo y bebida");
  return {state:st,tx};
}

let stateRef=null,txCol=null,stateQueue=Promise.resolve(),downloads=null;
const store={
  saveState(){lsSet();if(S.mode!=="db")return;const body=JSON.parse(JSON.stringify(S.state));
    stateQueue=stateQueue.then(()=>stateRef.set(body)).catch(onWriteErr)},

function onWriteErr(e){toast(e&&e.code==="quota_exceeded"?"Espacio lleno: borra movimientos antiguos para seguir guardando.":"No se ha podido guardar el último cambio. Revisa tu conexión.")}

async function connect(){
  let db=null,user=null;
  try{if(window.claude&&claude.use){[db,user,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")])}}catch(e){db=null}
  const id=user?await user.id().catch(()=>null):null;
  if(!db||!id){S.mode="local";setStatus("Guardado en este móvil · haz copias de seguridad en Ajustes");applyRecurring();render();return}
  S.mode="db";
  stateRef=db.doc("data/users/"+id+"/wallet");
  txCol=stateRef.collection("tx");
  let gotState=false,gotTx=false,stateExists=false,remoteTx=[],first=true;
  const timer=setTimeout(()=>setStatus("No se puede conectar todavía; los datos pueden no estar al día"),10000);
  const settle=()=>{
    if(!gotState||!gotTx)return;
    clearTimeout(timer);setStatus("Guardado en tu cuenta · privado");
    if(stateExists||remoteTx.length){S.demo=false;S.tx=remoteTx}
    else if(first&&!S.demo){store.saveState();S.tx.forEach(t=>store.putTx(t))}
    first=false;lsSet();applyRecurring();
    if(!$("#sheetHost").innerHTML)render();
  };
  stateRef.onSnapshot(snap=>{
    if(snap.exists){S.state=Object.assign(defaultState(),JSON.parse(JSON.stringify(snap.data())));stateExists=true}
    gotState=true;settle();
  },()=>{clearTimeout(timer);S.mode="local";setStatus("Sin conexión con tu cuenta: guardando en este navegador");render()});
  txCol.onSnapshot(snap=>{remoteTx=snap.docs.map(d=>Object.assign({id:d.id},d.data()));gotTx=true;settle()},()=>{});
}

/* Gastos fijos: crea el movimiento de cada mes cuando llega su día (id fijo por mes = sin duplicados) */
function nextYM(s){let[y,m]=s.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+pad(m)}
function applyRecurring(){
  if(S.demo||S.recDone)return;S.recDone=true;
  let changed=false;
  (S.state.recurring||[]).forEach(r=>{
    if(!r.active)return;
    let cur=r.last?nextYM(r.last):(r.from||TODAY_YM);let guard=0;
    while(cur<=TODAY_YM&&guard++<24){
      const[y,m]=cur.split("-").map(Number);const day=Math.min(r.day,dim(y,m-1));
      if(cur===TODAY_YM&&day>today.getDate())break;
      const id="r-"+r.id+"-"+cur;
      if(!S.tx.some(t=>t.id===id)){const t={id,type:r.type,amount:r.amount,cat:r.cat,acc:r.acc,date:cur+"-"+pad(day),note:r.note,ts:Date.now(),rec:r.id};if(r.type==="transfer")t.to=r.to;S.tx.push(t);store.putTx(t)}
      r.last=cur;changed=true;cur=nextYM(cur);
    }
  });
  if(changed)store.saveState();
}

function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

function cumSvg(mt,budget){
  const n=dim(S.y,S.m),upto=elapsedDays();const daily=new Array(n+1).fill(0);
  mt.forEach(t=>{if(t.type==="gasto"){const d=+t.date.slice(8,10);daily[d]+=(+t.amount||0)}});
  const cum=[0];for(let d=1;d<=n;d++)cum[d]=cum[d-1]+daily[d];
  const maxV=Math.max(1,cum[Math.max(upto,0)]||0,budget||0);const step=niceStep(maxV);const top=Math.ceil(maxV/step)*step;
  const W=560,H=200,L=46,R=10,T=12,B=24,pw=W-L-R,ph=H-T-B;
  const x=d=>L+(d/n)*pw,y=v=>T+ph-(v/top)*ph;
  let g="";for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${Math.round(v)}€</text>`}
  [1,8,15,22,n].forEach(d=>g+=`<text x="${x(d)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${d}</text>`);
  let paths="";
  if(budget>0){paths+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(n)}" y2="${y(budget)}" stroke="var(--faint)" stroke-dasharray="4 4"/><line x1="${L}" x2="${W-R}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${W-R}" y="${y(budget)-6}" text-anchor="end" font-size="10.5" fill="var(--warn)" font-weight="600">Límite ${eur0.format(budget)}</text>`}
  if(upto>0){
    let d=`M${x(0)},${y(0)}`;for(let i=1;i<=upto;i++)d+=` L${x(i)},${y(cum[i])}`;
    const area=d+` L${x(upto)},${y(0)} Z`;
    const over=budget>0&&cum[upto]>budget;
    paths+=`<path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${d}" fill="none" stroke="${over?"var(--exp)":"var(--accent)"}" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="${x(upto)}" cy="${y(cum[upto])}" r="4.5" fill="var(--surface)" stroke="${over?"var(--exp)":"var(--accent)"}" stroke-width="2.4"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px;display:block" role="img" aria-label="Gasto acumulado por día">${g}${paths}</svg>${budget>0?`<div class="faint" style="font-size:12px;margin-top:4px">Línea discontinua gris: ritmo ideal para no pasarte.</div>`:""}`;
}

function barsSvg(){
  const ms=[];for(let i=5;i>=0;i--){const d=new Date(S.y,S.m-i,1);const mt=monthTx(d.getFullYear(),d.getMonth());ms.push({l:MES3[d.getMonth()],i:sumType(mt,"ingreso"),e:sumType(mt,"gasto"),cur:i===0})}
  const max=Math.max(1,...ms.map(v=>Math.max(v.i,v.e)));const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const W=560,H=190,L=46,B=24,T=10,ph=H-B-T,cw=(W-L-6)/6,bw=Math.min(20,cw*.28);const y=v=>T+ph-(v/top)*ph;
  let g="";for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${Math.round(v)}€</text>`;
  const bars=ms.map((v,k)=>{const cx=L+cw*k+cw/2;
    return `<rect x="${cx-bw-2}" y="${y(v.i)}" width="${bw}" height="${Math.max(0,T+ph-y(v.i))}" rx="4" fill="var(--inc)" opacity="${v.cur?1:.7}"/><rect x="${cx+2}" y="${y(v.e)}" width="${bw}" height="${Math.max(0,T+ph-y(v.e))}" rx="4" fill="var(--exp)" opacity="${v.cur?1:.7}"/><text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${v.cur?"var(--fg)":"var(--faint)"}" font-weight="${v.cur?700:500}">${v.l}</text>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px;display:block" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">${g}${bars}</svg>`;
}

function filteredMovs(){
  let l=monthTx(S.y,S.m);
  if(S.ftype!=="all")l=l.filter(t=>t.type===S.ftype);
  if(S.facc!=="all")l=l.filter(t=>t.acc===S.facc||t.to===S.facc);
  if(S.fcat!=="all")l=l.filter(t=>t.cat===S.fcat);
  const q=S.q.trim().toLowerCase();
  if(q)l=l.filter(t=>[t.note,catInfo(t.cat).label,(accById(t.acc)||{}).name,String(t.amount).replace(".",",")].join(" ").toLowerCase().includes(q));
  return l.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
}
function vMovs(){
  const l=filteredMovs();
  const types=[["all","Todos"],["gasto","Gastos"],["ingreso","Ingresos"],["transfer","Transferencias"]];
  const filters=`<div class="card filters">
    <div class="frow"><input id="fq" type="search" placeholder="Buscar por nota, categoría, cuenta o importe" value="${esc(S.q)}" aria-label="Buscar">
    <select id="fcat" aria-label="Categoría"><option value="all">Todas las categorías</option>${allCats().map(c=>`<option value="${esc(c.id)}" ${S.fcat===c.id?"selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
    <div class="chips">${types.map(([v,lb])=>`<button class="chip" data-ftype="${v}" aria-pressed="${S.ftype===v}">${lb}</button>`).join("")}<span style="width:8px;flex:none"></span>
    <button class="chip" data-facc="all" aria-pressed="${S.facc==="all"}">Todas las cuentas</button>${S.state.accounts.map(a=>`<button class="chip" data-facc="${esc(a.id)}" aria-pressed="${S.facc===a.id}">${esc(a.name)}</button>`).join("")}</div></div>`;
  if(!l.length)return filters+`<div class="card" id="movList"><p class="empty">${S.q||S.ftype!=="all"||S.facc!=="all"||S.fcat!=="all"?"Ningún movimiento coincide con los filtros.":`No hay movimientos en ${MESES[S.m].toLowerCase()}. Pulsa + para añadir uno.`}</p></div>`;
  let html="",last="";const days={};
  l.forEach(t=>{if(t.type!=="transfer")days[t.date]=(days[t.date]||0)+(t.type==="ingreso"?1:-1)*(+t.amount||0)});
  l.forEach(t=>{if(t.date!==last){if(last)html+="</div>";last=t.date;const d=new Date(t.date+"T12:00");const dv=days[t.date]||0;
    html+=`<div><div class="day"><span>${d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</span><span class="${dv>0?"inc":dv<0?"":"faint"}">${dv?(dv>0?"+":"−")+eur.format(Math.abs(dv)):""}</span></div>`}html+=txRow(t,false)});
  html+="</div>";
  const inc=sumType(l,"ingreso"),exp=sumType(l,"gasto");
  return filters+`<div class="card" id="movList"><h2>${l.length} movimiento${l.length===1?"":"s"} <small><span class="inc">+${eur.format(inc)}</span> &nbsp; <span class="exp">−${eur.format(exp)}</span></small></h2><div class="list">${html}</div></div>`;
}

function vMetas(){

    return `<div class="goal"><div class="line-between"><b style="font-size:15px">${esc(g.name)}</b><span>${p>=1?'<span class="pill ok">Conseguida</span>':`<b>${Math.round(p*100)}%</b>`}</span></div>
      <div class="bar" style="height:10px"><i style="width:${p*100}%;background:${colv(g.col||1)}"></i></div>
      <div class="line-between"><span class="muted">${eur.format(g.saved)} de ${eur0.format(g.target)}</span><span class="muted">${rest>0?"Faltan "+eur.format(rest):""}${plan}</span></div>
      <div class="acts"><input type="number" inputmode="decimal" min="0" step="1" placeholder="Importe" id="ga-${esc(g.id)}" aria-label="Importe para ${esc(g.name)}">
        <button class="btn sm" data-gadd="${esc(g.id)}">Aportar</button><button class="btn ghost sm" data-gsub="${esc(g.id)}">Retirar</button>
        <button class="mini" style="margin-left:auto" data-gdel="${esc(g.id)}">Eliminar</button></div></div>`}).join(""):`<p class="empty">Aún no tienes metas. Crea la primera abajo.</p>`;
  const tot=goals.reduce((s,g)=>s+(+g.saved||0),0),tt=goals.reduce((s,g)=>s+(+g.target||0),0);
  return `<div class="two"><div class="card" style="grid-column:1/-1"><h2>Tus metas <small>${eur.format(tot)} ahorrado de ${eur0.format(tt)}</small></h2><div>${list}</div></div></div>

      <button class="btn" type="submit" style="align-self:flex-start">Crear meta</button></form></div>`;
}

/* ---------- Eventos ---------- */
const armedK={};
function arm(btn,key,label,fn){
  if(armedK[key]){delete armedK[key];fn();return}
  const orig=btn.textContent;armedK[key]=1;btn.classList.add("armed");btn.textContent=label;
  setTimeout(()=>{delete armedK[key];if(btn.isConnected){btn.classList.remove("armed");btn.textContent=orig}},3500);
}
function toast(msg){const h=$("#toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",2600)}
function findTx(id){return S.tx.find(t=>t.id===id)}

function bindView(){
  $$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$("[data-edit]").forEach(r=>{const open=()=>openSheet(findTx(r.dataset.edit));r.onclick=open;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}}});
  /* movimientos */
  const fq=$("#fq");if(fq){fq.oninput=()=>{S.q=fq.value;const pos=fq.selectionStart;render();const n=$("#fq");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  const fc=$("#fcat");if(fc)fc.onchange=()=>{S.fcat=fc.value;render()};
  $$("[data-ftype]").forEach(b=>b.onclick=()=>{S.ftype=b.dataset.ftype;render()});
  $$("[data-facc]").forEach(b=>b.onclick=()=>{S.facc=b.dataset.facc;render()});
  /* presupuesto */
  $$("[data-lim]").forEach(inp=>inp.onchange=()=>{ensureReal();const v=Math.max(0,num(inp.value));const b=S.state.budget=S.state.budget||{total:0,cats:{}};b.cats=b.cats||{};
    if(inp.dataset.lim==="__total")b.total=v;else if(v)b.cats[inp.dataset.lim]=v;else delete b.cats[inp.dataset.lim];store.saveState();render();toast("Límite guardado")});
  /* metas */
  const gf=$("#goalForm");if(gf)gf.onsubmit=e=>{e.preventDefault();const n=$("#gName").value.trim(),t=num($("#gTarget").value);if(!n||t<=0)return;ensureReal();
    S.state.goals=S.state.goals||[];S.state.goals.push({id:"g"+uid(),name:n,target:t,saved:0,deadline:$("#gDate").value||"",col:(S.state.goals.length%8)+1});store.saveState();render();toast("Meta creada")};
  const gmove=(id,sign)=>{const inp=$("#ga-"+CSS.escape(id));const v=num(inp&&inp.value);if(v<=0){toast("Escribe un importe");return}ensureRealGoal(id,g=>{g.saved=Math.max(0,Math.round((g.saved+sign*v)*100)/100)});};
  $$("[data-gadd]").forEach(b=>b.onclick=()=>gmove(b.dataset.gadd,1));
  $$("[data-gsub]").forEach(b=>b.onclick=()=>gmove(b.dataset.gsub,-1));
  $$("[data-gdel]").forEach(b=>b.onclick=()=>arm(b,"g"+b.dataset.gdel,"¿Seguro?",()=>{ensureReal();S.state.goals=(S.state.goals||[]).filter(g=>g.id!==b.dataset.gdel);store.saveState();render()}));
  /* ajustes: cuentas */
  $$("[data-accname]").forEach(inp=>inp.onchange=()=>{const v=inp.value.trim();if(!v)return render();ensureReal();const a=accById(inp.dataset.accname);if(a){a.name=v;store.saveState();render();toast("Cuenta actualizada")}});
  $$("[data-accinit]").forEach(inp=>inp.onchange=()=>{ensureReal();const a=accById(inp.dataset.accinit);if(a){a.initial=num(inp.value);store.saveState();render();toast("Saldo inicial guardado")}});
  $$("[data-delacc]").forEach(b=>b.onclick=()=>arm(b,"a"+b.dataset.delacc,b.dataset.used==="1"?"¿Borrar con sus movimientos?":"¿Seguro?",()=>{
    ensureReal();const id=b.dataset.delacc;const gone=S.tx.filter(t=>t.acc===id||t.to===id);S.tx=S.tx.filter(t=>!(t.acc===id||t.to===id));gone.forEach(t=>store.delTx(t.id));
    S.state.accounts=S.state.accounts.filter(a=>a.id!==id);S.state.recurring=(S.state.recurring||[]).filter(r=>r.acc!==id&&r.to!==id);if(S.facc===id)S.facc="all";store.saveState();render()}));
  const af=$("#accForm");if(af)af.onsubmit=e=>{e.preventDefault();const n=$("#accName").value.trim();if(!n)return;ensureReal();
    const used=S.state.accounts.map(a=>a.col);let col=1;while(used.includes(col)&&col<8)col++;
    S.state.accounts.push({id:"a"+uid(),name:n,initial:num($("#accInit").value),col});store.saveState();render();toast("Cuenta añadida")};
  /* ajustes: categorías */
  let swc=5;$$("[data-sw]").forEach(b=>b.onclick=()=>{swc=+b.dataset.sw;$$("[data-sw]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const cf=$("#catForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const n=$("#cName").value.trim();if(!n)return;ensureReal();
    S.state.customCats=S.state.customCats||[];S.state.customCats.push({id:"c"+uid(),label:n,type:$("#cType").value,col:swc});store.saveState();render();toast("Categoría añadida")};
  $$("[data-catdel]").forEach(b=>b.onclick=()=>arm(b,"c"+b.dataset.catdel,"¿Seguro?",()=>{ensureReal();const id=b.dataset.catdel;
    S.state.customCats=(S.state.customCats||[]).filter(c=>c.id!==id);if(S.state.budget&&S.state.budget.cats)delete S.state.budget.cats[id];store.saveState();render()}));
  /* ajustes: fijos */
  const rt=$("#rType");if(rt)rt.onchange=()=>{$("#rCat").innerHTML=catsOf(rt.value).map(c=>`<option value="${esc(c.id)}">${esc(c.label)}</option>`).join("")};
  const rf=$("#recForm");if(rf)rf.onsubmit=e=>{e.preventDefault();const amt=num($("#rAmt").value);const day=Math.min(31,Math.max(1,parseInt($("#rDay").value)||1));if(amt<=0)return;ensureReal();
    S.state.recurring=S.state.recurring||[];S.state.recurring.push({id:uid(),type:rt.value,amount:amt,cat:$("#rCat").value,acc:$("#rAcc").value,day,note:$("#rNote").value.trim(),active:true,from:TODAY_YM,last:""});
    S.recDone=false;store.saveState();applyRecurring();render();toast(day<=today.getDate()?"Fijo añadido y apuntado este mes":"Fijo añadido: se apuntará el día "+day)};
  $$("[data-rectog]").forEach(c=>c.onchange=()=>{ensureReal();const r=(S.state.recurring||[]).find(x=>x.id===c.dataset.rectog);if(r){r.active=c.checked;if(c.checked&&!r.last)r.from=TODAY_YM;store.saveState();S.recDone=false;applyRecurring();render()}});
  $$("[data-recdel]").forEach(b=>b.onclick=()=>arm(b,"r"+b.dataset.recdel,"¿Seguro?",()=>{ensureReal();S.state.recurring=(S.state.recurring||[]).filter(r=>r.id!==b.dataset.recdel);store.saveState();render()}));
  /* exportar y borrar */
  const ex=$("#exportBtn");if(ex)ex.onclick=exportCsv;
  const bo=$("#bkOut");if(bo)bo.onclick=()=>{if(S.demo){toast("No hay datos tuyos todavía");return}saveFile("miwallet-copia-"+iso(today)+".json",JSON.stringify({app:"miwallet",v:2,state:S.state,tx:S.tx}),"application/json");toast("Copia descargada")};
  const bi=$("#bkIn");if(bi)bi.onchange=()=>{const f=bi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!j.state||!Array.isArray(j.tx))throw 0;
    S.state=Object.assign(defaultState(),j.state);S.tx=j.tx;S.demo=false;S.recDone=false;lsSet();applyRecurring();render();toast("Copia restaurada: "+S.tx.length+" movimientos")}catch(e){toast("Ese archivo no es una copia válida de Mi Wallet")}};r.readAsText(f)};
  const wp=$("#wipeBtn");if(wp)wp.onclick=()=>arm(wp,"wipe","Pulsa otra vez para borrar todo",()=>{
    if(S.demo){ensureReal();render();return}
    const ids=S.tx.map(t=>t.id);S.tx=[];ids.forEach(id=>store.delTx(id));S.state=defaultState();store.saveState();S.facc="all";S.fcat="all";render();toast("Datos borrados")});
}
function ensureRealGoal(id,fn){if(S.demo){ensureReal();render();toast("Empezamos de cero: crea tu meta abajo");return}const g=(S.state.goals||[]).find(x=>x.id===id);if(g){fn(g);store.saveState();render();toast("Meta actualizada")}}

function saveFile(n,d,t){const b=new Blob([d],{type:t});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function exportCsv(){
  const rows=[["Fecha","Tipo","Categoría","Cuenta","Cuenta destino","Importe","Nota"]];
  S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type==="transfer"?"Transferencia":t.type==="ingreso"?"Ingreso":"Gasto",t.type==="transfer"?"":catInfo(t.cat).label,(accById(t.acc)||{}).name||"",t.to?(accById(t.to)||{}).name||"":"",String((t.type==="gasto"?-1:1)*(+t.amount||0)).replace(".",","),t.note||""]));
  const csv="﻿"+rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\n");
  const name="miwallet-"+iso(today)+".csv";
  saveFile(name,csv,"text/csv");toast("CSV descargado");return;
  $("#csvBox").innerHTML=`<label class="f">Copia este texto y pégalo en un archivo .csv<textarea id="csvTxt" rows="6" readonly>${esc(csv.slice(1))}</textarea></label><button class="btn sm ghost" id="copyCsv" style="align-self:flex-start">Copiar</button>`;
  $("#copyCsv").onclick=()=>{const ta=$("#csvTxt");navigator.clipboard.writeText(ta.value).then(()=>toast("Copiado"),()=>{ta.select()})};
}

/* ---------- Hoja: nuevo / editar movimiento ---------- */
function openSheet(edit){
  if(edit&&S.demo){ensureReal();render();toast("Empezamos de cero: añade tu primer movimiento");return}
  let type=edit?edit.type:"gasto";const host=$("#sheetHost");let delArmed=false;
  const keep={};
  const draw=()=>{
    const accs=(S.demo?defaultState():S.state).accounts;const cats=catsOf(type);
    const def=edit?edit.date:(isCurMonth()?iso(today):iso(new Date(S.y,S.m,1)));
    const v=k=>keep[k]!==undefined?keep[k]:(edit?edit[k]:undefined);
    const accOpts=sel=>accs.map(a=>`<option value="${esc(a.id)}" ${sel===a.id?"selected":""}>${esc(a.name)}</option>`).join("");
    host.innerHTML=`<div class="sheet-bg" id="sbg"><form class="sheet" id="txForm" role="dialog" aria-modal="true" aria-label="${edit?"Editar":"Nuevo"} movimiento">
      <h3>${edit?"Editar movimiento":"Nuevo movimiento"} ${edit&&edit.rec?'<span class="tag">fijo</span>':""}</h3>
      <div class="seg"><button type="button" class="e" data-t="gasto" aria-pressed="${type==="gasto"}">Gasto</button><button type="button" class="i" data-t="ingreso" aria-pressed="${type==="ingreso"}">Ingreso</button><button type="button" data-t="transfer" aria-pressed="${type==="transfer"}">Transferir</button></div>
      <input class="amount-in" id="fAmt" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00 €" aria-label="Importe" value="${v("amount")??""}">
      ${type==="transfer"?`<div class="grid2"><label class="f">Desde<select id="fAcc">${accOpts(v("acc")||accs[0].id)}</select></label><label class="f">Hacia<select id="fTo">${accOpts(v("to")||(accs[1]||accs[0]).id)}</select></label></div>`:
      `<div class="grid2"><label class="f">Categoría<select id="fCat">${cats.map(c=>`<option value="${esc(c.id)}" ${v("cat")===c.id?"selected":""}>${esc(c.label)}</option>`).join("")}</select></label>
       <label class="f">Cuenta<select id="fAcc">${accOpts(v("acc"))}</select></label></div>`}
      <div class="grid2"><label class="f">Fecha<input id="fDate" type="date" value="${esc(v("date")||def)}"></label>
      <label class="f">Nota<input id="fNote" maxlength="40" placeholder="Opcional" value="${esc(v("note")||"")}"></label></div>
      <p class="err" id="fErr" hidden></p>
      <div class="grid2"><button type="button" class="btn ghost" id="fCancel">Cancelar</button><button class="btn" type="submit">${edit?"Guardar cambios":"Guardar"}</button></div>
      ${edit?`<button type="button" class="btn danger" id="fDel">Eliminar movimiento</button>`:""}
    </form></div>`;
    host.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{snap();type=b.dataset.t;delete keep.cat;draw()});
    $("#fCancel").onclick=close;$("#sbg").onmousedown=e=>{if(e.target.id==="sbg")close()};
    if(edit)$("#fDel").onclick=e=>{if(!delArmed){delArmed=true;e.target.textContent="Pulsa otra vez para eliminar";return}
      S.tx=S.tx.filter(t=>t.id!==edit.id);store.delTx(edit.id);close();render();toast("Movimiento eliminado")};
    $("#txForm").onsubmit=e=>{e.preventDefault();
      const amount=num($("#fAmt").value);const err=$("#fErr");
      if(amount<=0){err.hidden=false;err.textContent="Escribe un importe mayor que 0.";return}
      if(type==="transfer"&&$("#fAcc").value===$("#fTo").value){err.hidden=false;err.textContent="Elige dos cuentas distintas.";return}
      const date=$("#fDate").value||iso(today);
      ensureReal();
      const t={id:edit?edit.id:uid(),type,amount,acc:$("#fAcc").value,date,note:$("#fNote").value.trim(),ts:edit?(edit.ts||Date.now()):Date.now()};
      if(type==="transfer")t.to=$("#fTo").value;else t.cat=$("#fCat").value;
      if(edit&&edit.rec)t.rec=edit.rec;
      if(S.state.accounts.every(a=>a.id!==t.acc))t.acc=S.state.accounts[0].id;
      S.tx=S.tx.filter(x=>x.id!==t.id);S.tx.push(t);store.putTx(t);
      const d=new Date(date+"T12:00");S.y=d.getFullYear();S.m=d.getMonth();
      close();render();toast(edit?"Cambios guardados":"Movimiento añadido");
    };
    setTimeout(()=>{const a=$("#fAmt");if(a&&!edit)a.focus()},60);
  };
  const snap=()=>{const g=id=>{const el=$(id);return el?el.value:undefined};keep.amount=g("#fAmt");keep.acc=g("#fAcc");keep.to=g("#fTo");keep.date=g("#fDate");keep.note=g("#fNote")};
  const close=()=>{host.innerHTML="";document.removeEventListener("keydown",esck)};
  const esck=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",esck);
  draw();
}

$("#prevM").onclick=()=>{S.m--;if(S.m<0){S.m=11;S.y--}render()};
$("#nextM").onclick=()=>{S.m++;if(S.m>11){S.m=0;S.y++}render()};
$("#todayM").onclick=()=>{S.y=today.getFullYear();S.m=today.getMonth();render()};
$("#startBtn").onclick=()=>{ensureReal();render();toast("Wallet vacío listo. Ajusta tus cuentas y añade movimientos.")};
$("#fab").onclick=()=>openSheet();
$("#sideAdd").onclick=()=>openSheet();

render();
connect();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
